
name: Generate Contribution Line Graph

on:
  workflow_dispatch:
  schedule:
    - cron: "15 0 * * *"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install matplotlib
        run: pip install matplotlib

      - name: Generate SVG line graph
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python - <<'PY'
          import os
          import json
          import urllib.request
          from datetime import datetime, timedelta, timezone
          import matplotlib
          matplotlib.use("Agg")
          import matplotlib.pyplot as plt
          import matplotlib.dates as mdates
          from matplotlib.ticker import MaxNLocator

          username = "keshab-bhandari13"
          today = datetime.now(timezone.utc).date()
          start = today - timedelta(days=30)

          query = """
          query($login: String!, $from: DateTime!, $to: DateTime!) {
            user(login: $login) {
              contributionsCollection(from: $from, to: $to) {
                contributionCalendar {
                  weeks {
                    contributionDays {
                      date
                      contributionCount
                    }
                  }
                }
              }
            }
          }
          """

          variables = {
              "login": username,
              "from": start.isoformat() + "T00:00:00Z",
              "to": today.isoformat() + "T23:59:59Z"
          }

          payload = json.dumps({
              "query": query,
              "variables": variables
          }).encode()

          request = urllib.request.Request(
              "https://api.github.com/graphql",
              data=payload,
              headers={
                  "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                  "Content-Type": "application/json",
                  "User-Agent": "github-profile-graph"
              }
          )

          with urllib.request.urlopen(request) as response:
              result = json.load(response)

          if result.get("errors"):
              raise RuntimeError(str(result["errors"]))

          weeks = result["data"]["user"][
              "contributionsCollection"
          ]["contributionCalendar"]["weeks"]

          contributions = {}
          for week in weeks:
              for day in week["contributionDays"]:
                  contributions[day["date"]] = day[
                      "contributionCount"
                  ]

          dates = [
              start + timedelta(days=i)
              for i in range(31)
          ]
          counts = [
              contributions.get(d.isoformat(), 0)
              for d in dates
          ]

          plt.rcParams.update({
              "font.size": 10,
              "text.color": "#c9d1d9",
              "axes.labelcolor": "#c9d1d9",
              "xtick.color": "#8b949e",
              "ytick.color": "#8b949e",
              "svg.fonttype": "none"
          })

          fig, ax = plt.subplots(figsize=(12, 4.4))
          fig.patch.set_facecolor("#0d1117")
          ax.set_facecolor("#0d1117")

          ax.plot(
              dates,
              counts,
              color="#70a5fd",
              linewidth=2.5,
              marker="o",
              markersize=3.5
          )

          ax.fill_between(
              dates,
              counts,
              color="#70a5fd",
              alpha=0.15
          )

          ax.set_title(
              "GitHub Contribution Activity",
              fontsize=16,
              fontweight="bold",
              pad=20
          )

          ax.set_xlabel("Date", labelpad=12)
          ax.set_ylabel("Contributions", labelpad=12)
          ax.set_ylim(bottom=0)

          ax.yaxis.set_major_locator(
              MaxNLocator(integer=True)
          )

          ax.xaxis.set_major_locator(
              mdates.DayLocator(interval=5)
          )
          ax.xaxis.set_major_formatter(
              mdates.DateFormatter("%b %d")
          )

          ax.grid(
              True,
              color="#30363d",
              linestyle="--",
              alpha=0.55
          )

          for spine in ax.spines.values():
              spine.set_visible(False)

          plt.xticks(rotation=0)
          plt.tight_layout()

          os.makedirs("assets", exist_ok=True)
          plt.savefig(
              "assets/contribution-graph.svg",
              format="svg",
              facecolor=fig.get_facecolor()
          )
          plt.close()

          print("Contribution graph generated!")
          PY

      - name: Commit generated graph
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/contribution-graph.svg
          if ! git diff --cached --quiet; then
            git commit -m "Update contribution graph"
            git push
          fi
